name: Trigger IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch: # Membolehkan anda klik butang "Run workflow" secara manual pada bila-bila masa

jobs:
  ping-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Wait for Vercel Deployment (30s)
        run: sleep 30 # Memberikan masa 30 saat untuk Vercel selesai membina (build) kemas kini

      - name: Run IndexNow Script
        run: node scripts/indexnow.js
