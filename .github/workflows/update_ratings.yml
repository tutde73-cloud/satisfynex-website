name: Auto Update Analyst Ratings

on:
  schedule:
    # Berjalan otomatis setiap hari jam 06:00 UTC (14:00 WITA)
    - cron: '0 6 * * *'
  workflow_dispatch: # Memunculkan tombol 'Run workflow' manual di tab Actions

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch script
        env:
          API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python fetch_ratings.py

      - name: Commit and push updated ratings
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ratings.json || git add -A
          git commit -m "Auto-update analyst ratings data" || exit 0
          git push
